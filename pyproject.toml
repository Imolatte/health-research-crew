[project]
name = "health-research-crew"
version = "0.1.0"
description = "LangGraph multi-agent health supplement fact-checker"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-groq>=0.2",
    "langchain-community>=0.3",
    "duckduckgo-search>=6.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:BuildBackend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
